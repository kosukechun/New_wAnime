name: new-wanime
x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-wanime}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wanime}
  APP_URL: ${APP_URL:?Set APP_URL}
  TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
  MAL_CLIENT_ID: ${MAL_CLIENT_ID:-}
  ANILIST_ENABLED: ${ANILIST_ENABLED:-false}
  ANILIST_PERMISSION_CONFIRMED: ${ANILIST_PERMISSION_CONFIRMED:-false}
  SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-24}
  SYNC_MAX_WORKS: ${SYNC_MAX_WORKS:-160}
  COLLECTOR_USER_AGENT: ${COLLECTOR_USER_AGENT:-New_wAnime/1.0}
  REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
  TRUST_PROXY: "true"
services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wanime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wanime}
      TZ: Asia/Tokyo
    volumes:
      # PostgreSQL 18では親ディレクトリにマウントする。
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
  migrate:
    build: { context: ., target: operations }
    environment: *app-environment
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
  app:
    build: { context: ., target: runtime }
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
    expose: ["3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [internal]
  worker:
    build: { context: ., target: operations }
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    networks: [internal]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  internal:
    driver: bridge
